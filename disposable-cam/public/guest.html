<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kamera Acara</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:16px system-ui;background:#14110f;color:#f3ece2}
.v{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}.v.on{display:flex}
input,button{font:inherit;padding:14px;border-radius:12px;border:1px solid #3a322b;background:#211c18;color:inherit;width:100%;max-width:340px}
button{background:#e8742c;border:0;font-weight:600}
#cam{padding:0;justify-content:space-between;gap:0}#top{width:100%;display:flex;justify-content:space-between;padding:12px 16px;font-size:14px}
#pv{width:100%;flex:1;min-height:0;object-fit:contain;background:#000}
#bar{width:100%;padding:10px 0 18px}#fl{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px}
#fl button{width:auto;flex:none;padding:8px 14px;border-radius:99px;background:#211c18;border:1px solid #3a322b;font-weight:400}#fl .a{background:#e8742c}
#ctl{display:flex;align-items:center;justify-content:space-around}#sh{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#e8742c;padding:0}
#ctl .s{width:auto;background:none;font-size:26px;padding:8px}
#gal{justify-content:flex-start;overflow:auto}#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;width:100%}
#g img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.blur{filter:blur(18px);width:200px;height:260px;background:linear-gradient(135deg,#e8742c,#6b3a2a);border-radius:12px}
</style></head><body>
<video id=vid playsinline muted style="position:fixed;width:1px;height:1px;opacity:0"></video>
<div class="v on" id=load>Memuat…</div>
<div class=v id=name><h1 id=t></h1><p>Kamu punya <b id=q></b> foto. Hasilnya terbuka bersamaan saat reveal.</p>
  <input id=nm placeholder="Namamu"><button id=go>Mulai</button></div>
<div class=v id=cam><div id=top><span id=cnt></span><span id=cd></span></div><canvas id=pv></canvas>
  <div id=bar><div id=fl></div><div id=ctl><button class=s id=fp>🔄</button><button id=sh></button><span style="width:42px"></span></div></div></div>
<div class=v id=done><div class=blur></div><h2>Jatah foto habis 🎞️</h2><p id=cd2></p></div>
<div class=v id=gal><h2 id=gt></h2><div id=g></div></div>
<script>
const $=i=>document.getElementById(i),id=location.pathname.split('/').pop();
const gid=localStorage.gid||(localStorage.gid=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());
let info,used=0,fk='disposable',facing='environment',stream,run=0,shown=0;
// t = pengali warna RGB, c = kontras, s = saturasi, b = kecerahan, g = grain, v = vignette
const F={asli:{n:'Asli'},
 disposable:{n:'Disposable',c:1.15,s:1.1,b:1.05,t:[1.08,1.02,.88],g:28,v:.35,date:1,leak:1},
 film:{n:'Film 35mm',c:1.05,s:.9,b:1.03,t:[1.04,1,.93],g:18,v:.2},
 lomo:{n:'Lomo',c:1.3,s:1.35,b:.98,t:[1,1.05,1.1],g:20,v:.7},
 polaroid:{n:'Polaroid',c:.9,s:.85,b:1.08,t:[1.06,1,.95],g:10,v:.1,frame:1},
 dv:{n:'90s DV',c:.95,s:.75,b:1,t:[.95,1.05,1],g:35,v:.3,date:1},
 ccd:{n:'CCD',c:1.25,s:1.2,b:1.1,t:[1,1.02,1.08],g:8,v:.15,date:1},
 leak:{n:'Light Leak',c:1.1,s:1.1,b:1.05,t:[1.05,1,.92],g:14,v:.25,leak:1},
 bw:{n:'Hitam Putih',c:1.25,s:0,b:1.02,t:[1,1,1],g:30,v:.4}};
function fx(x,w,h,f){if(!f.c)return;
 const im=x.getImageData(0,0,w,h),d=im.data,[tr,tg,tb]=f.t,cx=w/2,cy=h/2,md=Math.sqrt(cx*cx+cy*cy);
 for(let y=0,i=0;y<h;y++)for(let X=0;X<w;X++,i+=4){
  let r=d[i]*tr,g=d[i+1]*tg,b=d[i+2]*tb;const l=.299*r+.587*g+.114*b;
  r=l+(r-l)*f.s;g=l+(g-l)*f.s;b=l+(b-l)*f.s;
  const dx=X-cx,dy=y-cy,vg=1-f.v*(dx*dx+dy*dy)/(md*md),n=(Math.random()-.5)*f.g;
  d[i]=(((r-128)*f.c+128)*f.b+n)*vg;d[i+1]=(((g-128)*f.c+128)*f.b+n)*vg;d[i+2]=(((b-128)*f.c+128)*f.b+n)*vg;}
 x.putImageData(im,0,0)}
function leak(x,w,h,f){if(!f.leak)return;x.globalCompositeOperation='screen';
 const g=x.createRadialGradient(w,0,0,w,0,w*.7);g.addColorStop(0,'rgba(255,90,20,.55)');g.addColorStop(1,'rgba(255,90,20,0)');
 x.fillStyle=g;x.fillRect(0,0,w,h);x.globalCompositeOperation='source-over'}
function stamp(x,w,h,f){if(!f.date)return;const d=new Date();
 x.font=`${Math.round(w*.04)}px monospace`;x.fillStyle='#ff8a1f';x.textAlign='right';
 x.fillText(`'${String(d.getFullYear()).slice(2)} ${d.getMonth()+1} ${d.getDate()}`,w*.95,h*.95)}
const style=(x,w,h,f)=>{fx(x,w,h,f);leak(x,w,h,f);stamp(x,w,h,f)};

const show=v=>document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==v));
const stop=()=>{run=0;stream&&stream.getTracks().forEach(t=>t.stop())};
const cnt=()=>$('cnt').textContent=`📷 ${info.quota-used} tersisa`;
async function init(){
 info=await(await fetch(`/api/events/${id}?gid=${gid}`)).json();
 if(info.error)return $('load').textContent=info.error;
 used=info.used;$('t').textContent=info.name;$('q').textContent=info.quota;
 $('nm').value=localStorage['n'+id]||'';
 if(info.revealed)return gallery();
 show(used>=info.quota?'done':'name');tick();setInterval(tick,1000)}
function tick(){const s=Math.floor((new Date(info.revealAt)-Date.now())/1000);
 if(s<=0){if(!shown){stop();gallery()}return}
 $('cd').textContent=$('cd2').textContent=`Reveal ${Math.floor(s/3600)}j ${Math.floor(s%3600/60)}m ${s%60}d`}
async function gallery(){shown=1;show('gal');$('gt').textContent=info.name;
 const p=await(await fetch(`/api/events/${id}/photos`)).json();
 $('g').innerHTML=p.map(x=>`<a href="${x.url}" download><img loading=lazy src="${x.url}" alt=""></a>`).join('')||'Belum ada foto.'}
$('go').onclick=()=>{localStorage['n'+id]=$('nm').value.trim();show('cam');
 $('fl').innerHTML=Object.entries(F).map(([k,f])=>`<button data-k=${k} class="${k==fk?'a':''}">${f.n}</button>`).join('');
 $('fl').onclick=e=>{const k=e.target.dataset.k;if(!k)return;fk=k;[...$('fl').children].forEach(b=>b.classList.toggle('a',b.dataset.k==k))};
 start()};
async function start(){stop();
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:3840},height:{ideal:2160}}})}
 catch(e){return alert('Kamera tidak bisa dibuka. Izinkan akses kamera dan pastikan memakai HTTPS.')}
 vid.srcObject=stream;await vid.play();run=1;cnt();loop()}
function loop(){if(!run)return;const c=$('pv'),w=320,h=Math.round(w*vid.videoHeight/vid.videoWidth)||427;
 if(c.width!=w||c.height!=h){c.width=w;c.height=h}
 const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(vid,0,0,w,h);style(x,w,h,F[fk]);requestAnimationFrame(loop)}
$('fp').onclick=()=>{facing=facing=='user'?'environment':'user';start()};
$('sh').onclick=async()=>{if(!run||used>=info.quota)return;
 const w=vid.videoWidth,h=vid.videoHeight,c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');x.drawImage(vid,0,0);style(x,w,h,F[fk]);let out=c;
 if(F[fk].frame){const p=Math.round(w*.06),o=document.createElement('canvas');o.width=w+p*2;o.height=Math.round(h+p*3.2);
  const y=o.getContext('2d');y.fillStyle='#f6f2e9';y.fillRect(0,0,o.width,o.height);y.drawImage(c,p,p);out=o}
 $('sh').disabled=true;
 const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',.92)),fd=new FormData();
 fd.append('gid',gid);fd.append('guest',localStorage['n'+id]||'Tamu');fd.append('photo',blob,'p.jpg');
 try{const r=await fetch(`/api/events/${id}/photos`,{method:'POST',body:fd});if(!r.ok)throw 0;used=(await r.json()).used;cnt()}
 catch{alert('Gagal mengunggah, coba lagi.')}
 $('sh').disabled=false;if(used>=info.quota){stop();show('done')}};
init();
</script></body></html>
